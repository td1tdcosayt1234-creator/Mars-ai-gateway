name: Security Hardening CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1' # weekly

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npx --yes audit-ci --high

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
        env:
          AUTH_CODE_HASHES: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
          JWT_SECRET: ci-test-jwt-secret-0123456789abcdef0123456789abcdef0123456789abcdef
          TIER_HMAC: ci-test-tier-hmac-0123456789abcdef0123456789abcdef0123456789abcdef
          MASTER_KEY: ci-test-master-key-0123456789abcdef0123456789abcdef0123456789abcdef
      - run: npm test

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run sbom
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json

  headers-check:
    name: Security Headers Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify CSP in index.html
        run: |
          grep -q "Content-Security-Policy" index.html || (echo "CSP missing" && exit 1)
          grep -q "X-Content-Type-Options" index.html || (echo "nosniff missing" && exit 1)
          grep -q "X-Frame-Options" index.html || (echo "XFO missing" && exit 1)
          if grep -q "unsafe-eval" index.html; then echo "unsafe-eval must not ship to prod" && exit 1; fi
          echo "Headers OK"
      - name: Verify no hardcoded secrets
        run: |
          ! grep -R "ak_mars_live_9f82\|c55d6cf023bb7f3eee1a914\|dev_secret\|tier1_tier2_shared_dev" --include="*.js" --include="*.ts" --include="*.tsx" server src server.js || (echo "hardcoded secret found" && exit 1)
          echo "Secrets OK"
