# Branch protection + repo hardening as code (safe-settings / probot-settings)
# Apply via https://github.com/apps/settings or safe-settings. Enforces 10/10 governance.
repository:
  description: "Mars AI Gateway — hardened 3-tier AI relay (10/10)"
  private: false
  has_issues: true
  has_projects: false
  has_wiki: false
  default_branch: main
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: true
  delete_branch_on_merge: true
  enable_automated_security_fixes: true
  enable_vulnerability_alerts: true
  secret_scanning: true
  secret_scanning_push_protection: true
  dependabot_alerts: true
  code_scanning: true

branches:
  - name: main
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
        require_code_owner_reviews: true
        require_last_push_approval: true
      required_status_checks:
        strict: true
        contexts:
          - "CodeQL Analysis"
          - "Dependency Audit"
          - "Secret Scan (gitleaks)"
          - "Security Headers Check"
          - "Scorecard"
          - "Security Tests"
      enforce_admins: true
      required_linear_history: true
      allow_force_pushes: false
      allow_deletions: false
      required_conversation_resolution: true
      required_signatures: true
