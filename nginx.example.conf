# nginx.example.conf — TLS-terminating reverse proxy (alternative to Caddy)
# Backend stays on 127.0.0.1:5000. Get certs via certbot, then point
# ssl_certificate/ssl_certificate_key at the live files.
# Test: nginx -t -c nginx.example.conf | Reload: nginx -s reload

upstream mars_gateway {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    server_name gateway.example.com;
    # ACME challenge only over HTTP; everything else upgrades
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name gateway.example.com;

    ssl_certificate     /etc/letsencrypt/live/gateway.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gateway.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    location / {
        proxy_pass http://mars_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        client_max_body_size 64k;
    }
}
