services:
  - type: web
    name: mars-ai-gateway
    runtime: node
    region: singapore
    plan: starter
    branch: main
    repo: https://github.com/td1tdcosayt1234-creator/Mars-ai-gateway
    buildCommand: npm ci --ignore-scripts && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: mars-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES
        value: 30m
      - key: APP_URL
        value: https://mars-ai-gateway-free.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: TIER_HMAC
        generateValue: true
      - key: MASTER_KEY
        generateValue: true
      - key: KMS_PROVIDER
        value: local
      - key: REDIS_URL
        fromService:
          type: redis
          name: mars-redis
          property: connectionString
      - key: AUTH_CODE_HASHES
        sync: false
      - key: HONEY_TOKENS
        sync: false
      - key: ADMIN_SUBJECTS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
  - type: redis
    name: mars-redis
    region: singapore
    plan: free
    maxmemoryPolicy: noeviction
